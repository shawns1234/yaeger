; PlatformIO Project Configuration File

[project]
name = yaeger refactor
description = A custom ESP32 project for Yaeger
version = 0.1.0
build_dir = w:/github/yaeger/new
src_dir = w:/github/yaeger/new

;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
;   Please visit documentation for the other options and examples
;   https://docs.platformio.org/page/projectconf.html


[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
    cppcheck: --enable=all --std=c++17 --suppress=*:*/.pio/* --suppress=*:*/lib/* --suppress=missingIncludeSystem --suppress=unmatchedSuppression --suppress=missingInclude --suppress=unusedFunction
board_build.filesystem = littlefs

[core]
framework = arduino
build_flags =
    -I${project.src_dir}\src
    -D CORE_DEBUG_LEVEL=5
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_compat_mode = strict
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    adafruit/Adafruit MAX31855 library
    ayushsharma82/ElegantOTA
    ArduinoJson
    Adafruit NeoPixel
    SPI
    Wire
    https://bitbucket.org/David_Such/nexgen_filter.git#1.0.2
    ayushsharma82/WebSerial
    https://github.com/sebnil/Moving-Avarage-Filter--Arduino-Library-
#extra_scripts = pre:scripts/pre_build.py

[env:esp32-s3-devkitm-1]
extends = core
board = esp32-s3-devkitm-1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
build_flags =
    ${core.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:esp32-s3]
extends = core
board = esp32-s3-devkitc1-n16r8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32-s3-mini]
extends = core
board = lolin_s3_mini
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	${core.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D S3MINI=1

[env:test]
extends = core
board = esp32-s3-devkitm-1
build_flags =
    -I${project.src_dir}\src
    -I${project.src_dir}\src\API
    -I${project.src_dir}\src\Command
    -I${project.src_dir}\src\Controller
    -I${project.src_dir}\src\Display
    -I${project.src_dir}\src\Logging
    -I${project.src_dir}\src\Pwm
    -I${project.src_dir}\src\Sensor
    -I${project.src_dir}\src\vendor
    -I${project.src_dir}\src\WiFiManager
    -I${project.src_dir}\src\WifiSetup
    -D CORE_DEBUG_LEVEL=5
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    adafruit/Adafruit MAX31855 library
    ayushsharma82/ElegantOTA
    ArduinoJson
    Adafruit NeoPixel
    SPI
    Wire
    https://bitbucket.org/David_Such/nexgen_filter.git#1.0.2
    ayushsharma82/WebSerial
    https://github.com/sebnil/Moving-Avarage-Filter--Arduino-Library-
    file:///${project.src_dir}/lib/catch2/catch2.hpp
